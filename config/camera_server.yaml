# ros_camera_server 推流配置
# 架构说明：2026-10-16 实测 usb_cam 在此摄像头上限 ~15fps（GStreamer 层 29.4fps 正常），
# 故弃用 usb_cam，由 ros_camera_server 用 v4l2 直接采集（GStreamer 管线），
# 同时输出 WebRTC + /image_raw ROS 话题（VLA 客户端话题名不变）。
# address 必须填宿主机局域网 IP（浏览器按它连信令服务器；写 127.0.0.1 则只有本机能看）。
robot: "robot_deploy"
address: "58.206.217.128"
signaling_port: 8443

cameras:
  decxin:
    name: "DECXIN USB Camera"
    input:
      type: v4l2
      device: "/dev/video0"
      width: 640
      height: 480
      framerate: "30/1"
      media_type: "image/jpeg"   # MJPEG：实测稳定 29.4fps；YUYV 亦支持
    outputs:
      - type: webrtc
        codec: h264
        width: 640
        height: 480
        bitrate: 2000   # kbps；编码器留 auto，无 GPU 自动选软编（实测 openh264enc）
      - type: ros2
        topic: "/image_raw"
        frame_id: "camera_link"
        codec: raw   # 裸 sensor_msgs/Image 供 VLA 客户端订阅（auto 会选 JPEG 直通 → 只有 /image_raw/compressed）
